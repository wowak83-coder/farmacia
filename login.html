<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accedi — Farmacia di Casa</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--cream:#F7F3EE;--ink:#1A1612;--ink-muted:#8C7D70;--sage:#5B7B5E;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:2rem;}
  h2{font-family:'DM Serif Display',serif;font-size:2rem;color:var(--cream);}
  p{color:var(--ink-muted);font-size:.9rem;text-align:center;max-width:300px;line-height:1.7;}
  .btn-google{display:flex;align-items:center;gap:.8rem;padding:.9rem 2rem;background:var(--cream);color:var(--ink);border:none;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;}
  .btn-google:disabled{opacity:.5;}
  .btn-google svg{width:20px;height:20px;}
  .btn-apple{background:#000;color:#fff;border:1px solid #444;}
  #msg{font-size:.85rem;color:var(--ink-muted);min-height:1.2rem;text-align:center;}
  .success{color:#8AAE8D;font-size:1rem;text-align:center;}
  .steps{background:#1e1c18;border-radius:4px;padding:1.2rem 1.5rem;max-width:320px;width:100%;margin-top:.5rem;}
  .steps h3{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:.8rem;}
  .step{display:flex;gap:.8rem;align-items:flex-start;margin-bottom:.6rem;font-size:.85rem;color:#aaa;}
  .step:last-child{margin-bottom:0;}
  .step-num{background:#333;color:var(--cream);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;flex-shrink:0;margin-top:.1rem;}
</style>
</head>
<body>
  <div style="font-size:3rem">⚕</div>
  <h2>Farmacia di Casa</h2>
  <p id="msg">Accedi una volta sola — poi potrai usare l'app installata sulla home screen.</p>
  <button class="btn-google" id="btnLogin" onclick="doLogin()">
    <svg viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.5 30.2 0 24 0 14.8 0 6.9 5.4 3 13.3l7.9 6.1C12.7 13.2 17.9 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.9-9.9 6.9-17z"/>
      <path fill="#FBBC05" d="M10.9 28.6A14.8 14.8 0 0 1 9.5 24c0-1.6.3-3.1.8-4.6L2.4 13.3A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l8.3-6.1z"/>
      <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.1 0-11.3-3.7-13.1-9l-7.9 6.1C6.9 42.6 14.8 48 24 48z"/>
    </svg>
    Accedi con Google
  </button>
  <button class="btn-google btn-apple" id="btnApple" style="display:none" onclick="doLoginApple()">
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M16.37 12.6c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.47.83-.72 0-1.82-.81-2.99-.79-1.54.02-2.96.9-3.75 2.27-1.6 2.78-.41 6.88 1.15 9.13.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.77.74 2.98.72 1.23-.02 2.01-1.12 2.76-2.23.87-1.28 1.23-2.52 1.25-2.58-.03-.01-2.39-.92-2.4-3.65zM14.1 5.86c.63-.77 1.06-1.83.94-2.89-.91.04-2.01.61-2.66 1.37-.58.67-1.09 1.76-.96 2.79 1.02.08 2.05-.52 2.68-1.27z"/></svg>
    Accedi con Apple
  </button>
  <div id="postLogin" style="display:none;width:100%;max-width:320px;">
    <p class="success">✓ Accesso effettuato!</p>
    <div class="steps" style="margin-top:1rem;">
      <h3>Ora installa l'app</h3>
      <div class="step"><div class="step-num">1</div><span>Tocca il pulsante <strong>Condividi ↑</strong> in basso</span></div>
      <div class="step"><div class="step-num">2</div><span>Seleziona <strong>"Aggiungi a schermata Home"</strong></span></div>
      <div class="step"><div class="step-num">3</div><span>Tocca <strong>Aggiungi</strong></span></div>
      <div class="step"><div class="step-num">4</div><span>Apri l'app dalla home — sarai già loggato ✓</span></div>
    </div>
  </div>

<script type="module">
import { GoogleAuthProvider, OAuthProvider, signInWithPopup, signInWithRedirect, signInWithCredential,
  getRedirectResult, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { auth, isNative, FirebaseAuthentication } from './firebase-init.js';

const msg = t => { const el = document.getElementById('msg'); el.style.display = 'block'; el.textContent = t; };
const btns = () => document.querySelectorAll('.btn-google');
const busy = on => btns().forEach(b => b.disabled = on);

if (isNative) {
  // App iOS: niente istruzioni "aggiungi a Home", accesso nativo, poi si va all'app.
  document.getElementById('btnApple').style.display = 'flex';
  msg('Accedi per ritrovare i tuoi medicinali su tutti i dispositivi.');
  onAuthStateChanged(auth, user => { if (user) window.location.replace('index.html'); });
} else {
  onAuthStateChanged(auth, user => { if (user) showSuccess(); });
  getRedirectResult(auth).then(r => { if (r?.user) showSuccess(); }).catch(console.error);
}

window.doLogin = async () => {
  busy(true); msg('Accesso in corso...');
  if (isNative) {
    try {
      // Il plugin apre il login Google di iOS e ci restituisce il token;
      // l'accesso a Firebase lo fa poi l'SDK web, che è quello usato dall'app.
      const r = await FirebaseAuthentication.signInWithGoogle();
      await signInWithCredential(auth, GoogleAuthProvider.credential(r.credential?.idToken));
    } catch (e) { console.error(e); msg('Accesso non riuscito: ' + (e.message || e)); busy(false); }
    return;
  }
  const provider = new GoogleAuthProvider();
  try { await signInWithPopup(auth, provider); showSuccess(); }
  catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/popup-closed-by-user') {
      msg('Reindirizzamento...');
      await signInWithRedirect(auth, provider);
    } else { msg('Errore: ' + e.message); busy(false); }
  }
};

window.doLoginApple = async () => {
  busy(true); msg('Accesso in corso...');
  try {
    const r = await FirebaseAuthentication.signInWithApple();
    const cred = new OAuthProvider('apple.com').credential({
      idToken: r.credential?.idToken, rawNonce: r.credential?.nonce
    });
    await signInWithCredential(auth, cred);
  } catch (e) {
    console.error(e);
    msg('Accesso con Apple non riuscito. Serve l\'account sviluppatore Apple a pagamento: per ora usa Google.');
    busy(false);
  }
};

function showSuccess(){document.getElementById('btnLogin').style.display='none';document.getElementById('msg').style.display='none';document.getElementById('postLogin').style.display='block';}
</script>
</body>
</html>
